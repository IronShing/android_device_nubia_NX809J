name: Build NX809J

# Self-hosted CI for the RedMagic 11 Pro (NX809J) LineageOS port.
# Runs on a self-hosted runner on the build machine (where the ~268 GB tree lives) —
# GitHub-hosted runners can't build LOS (disk/time). Operates on the EXISTING tree at
# $LINEAGE; it does NOT git-checkout this repo (no actions/checkout step on purpose).
# Trigger: Actions tab -> Build NX809J -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      reposync:
        description: "repo sync before building (slow; off = use tree as-is)"
        type: boolean
        default: false
      target:
        description: "m target (empty = full ROM; e.g. 'productimage systemextimage' for incremental)"
        type: string
        default: ""

concurrency:
  group: nx809j-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, nx809j]
    timeout-minutes: 720
    env:
      LINEAGE: ${{ vars.LINEAGE_TREE || '/var/home/beast/android/lineage' }}
      SUPER_SCRIPT: ${{ vars.SUPER_SCRIPT || '/var/home/beast/lineage-scratch/build_super_v15_los_restore.sh' }}
      SUPER_IMG: ${{ vars.SUPER_IMG || '/var/home/beast/lineage-scratch/super_v15/super_v15_los.img' }}
      LC_ALL: C

    steps:
      - name: Environment
        run: |
          echo "tree=$LINEAGE"; df -h "$LINEAGE" | tail -1; free -g | sed -n '1,2p'

      - name: Restore out-of-tree patches (frameworks/base, vendor/lineage, CarrierConfig)
        run: bash "$LINEAGE/device/nubia/NX809J/patches/apply-patches.sh" || true

      - name: repo sync (optional)
        if: ${{ inputs.reposync }}
        run: |
          cd "$LINEAGE"
          repo sync -j8 -c --no-clone-bundle --current-branch
          # re-apply patches after a sync (it can reset the shared repos)
          bash device/nubia/NX809J/patches/apply-patches.sh || true

      - name: Build
        run: |
          cd "$LINEAGE"
          source build/envsetup.sh
          unset -f grep || true              # ugrep wrapper breaks soong dumpvars
          lunch lineage_NX809J-bp4a-userdebug
          m -j6 ${{ inputs.target }}

      - name: Assemble super (LOS partitions + stock vendor)
        run: bash "$SUPER_SCRIPT"

      - name: Collect + package artifacts
        id: pkg
        run: |
          OUT="$LINEAGE/out/target/product/NX809J"
          DST="$RUNNER_TEMP/nx809j-out"; rm -rf "$DST"; mkdir -p "$DST"
          # boot chain images are small -> upload directly
          for i in boot init_boot vendor_boot dtbo vbmeta vbmeta_system; do
            [ -f "$OUT/$i.img" ] && cp "$OUT/$i.img" "$DST/"
          done
          # super is ~19 GB raw -> zstd + split under GitHub's 2 GB/file release limit
          zstd -15 -T0 -f -o "$DST/super.img.zst" "$SUPER_IMG"
          split -b 1900M -d -a 2 "$DST/super.img.zst" "$DST/super.img.zst.part" && rm -f "$DST/super.img.zst"
          ( cd "$DST" && sha256sum * > SHA256SUMS )
          ls -lh "$DST"
          echo "dir=$DST" >> "$GITHUB_OUTPUT"
          echo "tag=nx809j-$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.pkg.outputs.tag }}" "${{ steps.pkg.outputs.dir }}"/* \
            --repo "${{ github.repository }}" \
            --title "NX809J ${{ steps.pkg.outputs.tag }}" \
            --notes $'Automated self-hosted build.\n\nReassemble super: `cat super.img.zst.part* | zstd -d -o super.img`\nFlash: EDL super + boot chain — see SOAK_CHECKLIST.md.'
